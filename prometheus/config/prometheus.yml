global:
  # global scrape frequency, can be overridden by individual jobs.
  scrape_interval: 20s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          server_name: <client-instance id>
          environment: <production/staging/uat/development>
  
  # Node exporter for monitoring server itself
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

